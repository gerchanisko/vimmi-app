# Builds the web app (PWA for iPhone and browsers) and publishes it on GitHub Pages:
# https://app.vimmi.space/
# It runs as part of a release (release.yml), so phones only get tested, released versions.
# Run it by hand to redeploy the current main.
name: Web app

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web
      - id: deploy
        uses: actions/deploy-pages@v4
