[package]
name = "vimmi"
version = "0.8.0-beta.1"
description = "Vimmi – poznámky, úkoly a kalendář s AI (Rust/Tauri beta)"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "vimmi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "windows-native", "apple-native"] }
gethostname = "1"
percent-encoding = "2"
mime_guess = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
